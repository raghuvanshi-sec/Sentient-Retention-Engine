version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    build:
      context: ./infra/database
    image: ${REGISTRY_OWNER:-sentient-retention}/sentient-postgres:latest
    container_name: sentient-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentient_db}
      POSTGRES_USER: ${POSTGRES_USER:-db_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentient-network

  # Redis for caching and pub/sub
  redis:
    image: redis:7-alpine
    container_name: sentient-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - sentient-network

  # Backend API Service
  backend:
    build:
      context: ./backend
    image: ${REGISTRY_OWNER:-sentient-retention}/sentient-backend:latest
    container_name: sentient-backend
    environment:
      PORT: ${BACKEND_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PREDICTION_SERVICE_URL: http://ml-service:8001
      AGENT_SERVICE_URL: http://agentic-ai:8002
      AGENTIC_AI_URL: http://agentic-ai:8002
      NODE_ENV: production
      API_VERSION: v1
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - postgres
      - redis
      - ml-service
      - agentic-ai
    networks:
      - sentient-network

  # Agentic AI Engine
  agentic-ai:
    build:
      context: ./agents
    image: ${REGISTRY_OWNER:-sentient-retention}/sentient-agentic-ai:latest
    container_name: sentient-agentic-ai
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "${AGENTIC_AI_PORT:-8002}:8002"
    depends_on:
      - postgres
      - redis
    networks:
      - sentient-network

  # ML Prediction Service
  ml-service:
    build:
      context: ./simulation/ml-service
    image: ${REGISTRY_OWNER:-sentient-retention}/sentient-ml-service:latest
    container_name: sentient-ml-service
    environment:
      PORT: ${ML_SERVICE_PORT:-8001}
      HOST: 0.0.0.0
    ports:
      - "${ML_SERVICE_PORT:-8001}:8001"
    networks:
      - sentient-network

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    image: ${REGISTRY_OWNER:-sentient-retention}/sentient-frontend:latest
    container_name: sentient-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - sentient-network


volumes:
  postgres_data:
  redis_data:

networks:
  sentient-network:
    driver: bridge